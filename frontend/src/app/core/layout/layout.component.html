<div class="min-h-screen flex flex-column surface-ground">
    <!-- Navbar Premium with gradient and shadow -->
    <p-toolbar styleClass="bg-gradient-primary text-white px-3 md:px-5 py-3 shadow-card z-5 flex-wrap">
        <div class="p-toolbar-group-start w-full md:w-auto justify-content-center md:justify-content-start mb-2 md:mb-0">
            <div class="flex align-items-center gap-2 cursor-pointer" routerLink="/usuarios">
                <i class="pi pi-wallet text-3xl text-white"></i>
                <h2 class="m-0 font-bold tracking-wide text-2xl text-white">GalleriaCRUD</h2>
            </div>
            <div class="ml-2 md:ml-6 flex gap-1 md:gap-2 overflow-x-auto w-full md:w-auto mt-3 md:mt-0 pb-1 md:pb-0" style="scrollbar-width: none;">
                <p-button icon="pi pi-users" label="Usuários" routerLink="/usuarios" routerLinkActive="nav-button-active" styleClass="p-button-text transition-colors transition-duration-200 border-round-lg white-space-nowrap nav-button"></p-button>
                <p-button icon="pi pi-id-card" label="Clientes" routerLink="/clientes" routerLinkActive="nav-button-active" styleClass="p-button-text transition-colors transition-duration-200 border-round-lg white-space-nowrap nav-button"></p-button>
                <p-button icon="pi pi-box" label="Produtos" routerLink="/produtos" routerLinkActive="nav-button-active" styleClass="p-button-text transition-colors transition-duration-200 border-round-lg white-space-nowrap nav-button"></p-button>
                <p-button icon="pi pi-shopping-cart" label="Pedidos" routerLink="/pedidos" routerLinkActive="nav-button-active" styleClass="p-button-text transition-colors transition-duration-200 border-round-lg white-space-nowrap nav-button"></p-button>
            </div>
        </div>
        <div class="p-toolbar-group-end w-full md:w-auto justify-content-center md:justify-content-end">
            <p-button icon="pi pi-sign-out" label="Sair" (onClick)="logout()" styleClass="p-button-danger p-button-outlined bg-white font-bold hover:bg-red-500 hover:text-white transition-colors transition-duration-200 border-round-lg"></p-button>
        </div>
    </p-toolbar>

    <!-- Main Content Container with max width for better reading -->
    <div class="flex-grow-1 p-3 md:p-5 w-full xl:w-10 mx-auto">
        <router-outlet></router-outlet>
    </div>
</div>
