<p-toast></p-toast>

<div class="grid justify-content-center">
    <div class="col-12 md:col-8">
        <p-card styleClass="border-none shadow-card border-round-2xl">
            <ng-template pTemplate="header">
                <div class="px-3 md:px-5 pt-4 md:pt-5 pb-3 border-bottom-1 surface-border flex align-items-center gap-3">
                    <div class="bg-blue-50 border-circle p-2 flex align-items-center justify-content-center">
                        <i class="pi pi-box text-blue-600 text-2xl"></i>
                    </div>
                    <h2 class="m-0 text-900 font-bold">{{isEditMode ? 'Editar Produto' : 'Novo Produto'}}</h2>
                </div>
            </ng-template>
            <div class="p-3 md:p-4">
            <form [formGroup]="produtoForm" (ngSubmit)="onSubmit()" class="p-fluid">
                
                <div class="field mb-4">
                    <label for="descricao" class="font-medium text-900">Descrição</label>
                    <input id="descricao" type="text" pInputText formControlName="descricao" placeholder="Digite a descrição do produto" [ngClass]="{'ng-invalid ng-dirty': produtoForm.get('descricao')?.invalid && produtoForm.get('descricao')?.touched}">
                    <small *ngIf="produtoForm.get('descricao')?.hasError('required') && produtoForm.get('descricao')?.touched" class="p-error">A descrição é obrigatória.</small>
                </div>

                <div class="field mb-4">
                    <label for="valor" class="font-medium text-900">Valor</label>
                    <p-inputNumber id="valor" formControlName="valor" mode="currency" currency="BRL" locale="pt-BR" [min]="0" [step]="0.01" placeholder="R$ 0,00" [ngClass]="{'ng-invalid ng-dirty': produtoForm.get('valor')?.invalid && produtoForm.get('valor')?.touched}"></p-inputNumber>
                    <small *ngIf="produtoForm.get('valor')?.invalid && produtoForm.get('valor')?.touched" class="p-error">O valor é obrigatório e deve ser maior que zero.</small>
                </div>

                <div class="flex justify-content-end gap-3 mt-5">
                    <p-button label="Cancelar" icon="pi pi-times" styleClass="p-button-secondary p-button-outlined" routerLink="/produtos"></p-button>
                    <p-button [label]="isEditMode ? 'Salvar' : 'Criar'" icon="pi pi-check" styleClass="p-button-primary" type="submit" [loading]="loading"></p-button>
                </div>
            </form>
            </div>
        </p-card>
    </div>
</div>
