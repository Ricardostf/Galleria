<p-toast></p-toast>
<p-confirmDialog></p-confirmDialog>

<p-card styleClass="border-none shadow-card border-round-2xl">
    <ng-template pTemplate="header">
        <div class="flex align-items-center justify-content-between px-5 pt-5 pb-3 border-bottom-1 surface-border">
            <div class="flex align-items-center gap-3">
                <div class="bg-blue-50 border-circle p-2 flex align-items-center justify-content-center">
                    <i class="pi pi-box text-blue-600 text-2xl"></i>
                </div>
                <h2 class="m-0 text-900 font-bold">Gerenciamento de Produtos</h2>
            </div>
            <p-button label="Novo Produto" icon="pi pi-plus" routerLink="/produtos/novo" styleClass="p-button-primary border-round-lg shadow-soft"></p-button>
        </div>
    </ng-template>

    <div class="p-3">
        <p-table [value]="produtos" [paginator]="true" [rows]="10" [loading]="loading" [rowHover]="true" responsiveLayout="scroll" styleClass="p-datatable-striped border-round-lg overflow-hidden">
        <ng-template pTemplate="header">
            <tr>
                <th>ID</th>
                <th>Descrição</th>
                <th>Valor</th>
                <th class="text-center">Ações</th>
            </tr>
        </ng-template>
        <ng-template pTemplate="body" let-produto>
            <tr>
                <td>{{produto.id}}</td>
                <td>{{produto.descricao}}</td>
                <td>{{produto.valor | currency:'BRL':'symbol':'1.2-2'}}</td>
                <td class="text-center">
                    <p-button icon="pi pi-pencil" styleClass="p-button-rounded p-button-text p-button-primary mr-2" (onClick)="editar(produto.id)"></p-button>
                    <p-button icon="pi pi-trash" styleClass="p-button-rounded p-button-text p-button-danger" (onClick)="confirmarExclusao(produto.id)"></p-button>
                </td>
            </tr>
        </ng-template>
        <ng-template pTemplate="emptymessage">
            <tr>
                <td colspan="4" class="text-center py-4">Nenhum produto encontrado.</td>
            </tr>
        </ng-template>
    </p-table>
    </div>
</p-card>
