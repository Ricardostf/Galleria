<p-toast></p-toast>
<p-confirmDialog></p-confirmDialog>

<p-card header="Gerenciamento de Produtos" styleClass="shadow-3 border-round-xl">
    
    <div class="flex justify-content-end mb-4">
        <p-button label="Novo Produto" icon="pi pi-plus" routerLink="/produtos/novo" styleClass="p-button-success border-round-lg shadow-2"></p-button>
    </div>

    <p-table [value]="produtos" [paginator]="true" [rows]="10" [loading]="loading" [rowHover]="true" styleClass="p-datatable-striped p-datatable-sm shadow-1 border-round-lg overflow-hidden">
        <ng-template pTemplate="header">
            <tr>
                <th>ID</th>
                <th>Descrição</th>
                <th>Valor</th>
                <th class="text-center">Ações</th>
            </tr>
        </ng-template>
        <ng-template pTemplate="body" let-produto>
            <tr>
                <td>{{produto.id}}</td>
                <td>{{produto.descricao}}</td>
                <td>{{produto.valor | currency:'BRL':'symbol':'1.2-2'}}</td>
                <td class="text-center">
                    <p-button icon="pi pi-pencil" styleClass="p-button-rounded p-button-text p-button-primary mr-2" (onClick)="editar(produto.id)"></p-button>
                    <p-button icon="pi pi-trash" styleClass="p-button-rounded p-button-text p-button-danger" (onClick)="confirmarExclusao(produto.id)"></p-button>
                </td>
            </tr>
        </ng-template>
        <ng-template pTemplate="emptymessage">
            <tr>
                <td colspan="4" class="text-center py-4">Nenhum produto encontrado.</td>
            </tr>
        </ng-template>
    </p-table>
</p-card>
