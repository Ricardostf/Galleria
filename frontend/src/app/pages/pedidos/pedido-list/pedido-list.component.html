<p-toast></p-toast>

<p-card styleClass="border-none shadow-card border-round-2xl">
    <ng-template pTemplate="header">
        <div class="flex align-items-center justify-content-between px-5 pt-5 pb-3 border-bottom-1 surface-border">
            <div class="flex align-items-center gap-3">
                <div class="bg-blue-50 border-circle p-2 flex align-items-center justify-content-center">
                    <i class="pi pi-shopping-cart text-blue-600 text-2xl"></i>
                </div>
                <h2 class="m-0 text-900 font-bold">Gerenciamento de Pedidos</h2>
            </div>
            <p-button label="Novo Pedido" icon="pi pi-plus" routerLink="/pedidos/novo" styleClass="p-button-primary border-round-lg shadow-soft"></p-button>
        </div>
    </ng-template>

    <div class="p-3">
        <p-table [value]="pedidos" [paginator]="true" [rows]="10" [loading]="loading" [rowHover]="true" styleClass="p-datatable-striped border-round-lg overflow-hidden">
        <ng-template pTemplate="header">
            <tr>
                <th>Número</th>
                <th>Data de Emissão</th>
                <th>Cliente</th>
                <th>Total</th>
                <th class="text-center">Ações</th>
            </tr>
        </ng-template>
        <ng-template pTemplate="body" let-pedido>
            <tr>
                <td class="font-bold text-primary">{{pedido.numero}}</td>
                <td>{{pedido.dataEmissao | date:'dd/MM/yyyy HH:mm'}}</td>
                <td>{{pedido.cliente?.nome}}</td>
                <td class="font-semibold">{{pedido.total | currency:'BRL':'symbol':'1.2-2'}}</td>
                <td class="text-center">
                    <p-button icon="pi pi-eye" styleClass="p-button-rounded p-button-text p-button-info" (onClick)="visualizar(pedido.id)" pTooltip="Visualizar Detalhes"></p-button>
                </td>
            </tr>
        </ng-template>
        <ng-template pTemplate="emptymessage">
            <tr>
                <td colspan="5" class="text-center py-4">Nenhum pedido encontrado.</td>
            </tr>
        </ng-template>
    </p-table>
    </div>
</p-card>
