<p-toast></p-toast>
<p-confirmDialog></p-confirmDialog>

<p-card styleClass="border-none shadow-card border-round-2xl">
    <ng-template pTemplate="header">
        <div class="flex align-items-center justify-content-between px-5 pt-5 pb-3 border-bottom-1 surface-border">
            <div class="flex align-items-center gap-3">
                <div class="bg-blue-50 border-circle p-2 flex align-items-center justify-content-center">
                    <i class="pi pi-users text-blue-600 text-2xl"></i>
                </div>
                <h2 class="m-0 text-900 font-bold">Gerenciamento de Usuários</h2>
            </div>
            <p-button label="Novo Usuário" icon="pi pi-plus" routerLink="/usuarios/novo" styleClass="p-button-primary border-round-lg shadow-soft"></p-button>
        </div>
    </ng-template>

    <div class="p-3">
        <p-table [value]="usuarios" [paginator]="true" [rows]="10" [loading]="loading" [rowHover]="true" responsiveLayout="scroll" styleClass="p-datatable-striped border-round-lg overflow-hidden">
        <ng-template pTemplate="header">
            <tr>
                <th>ID</th>
                <th>Nome</th>
                <th>Login</th>
                <th>Status</th>
                <th class="text-center">Ações</th>
            </tr>
        </ng-template>
        <ng-template pTemplate="body" let-usuario>
            <tr>
                <td>{{usuario.id}}</td>
                <td>{{usuario.nome}}</td>
                <td>{{usuario.login}}</td>
                <td>
                    <p-tag [severity]="usuario.ativo ? 'success' : 'danger'" [value]="usuario.ativo ? 'Ativo' : 'Inativo'"></p-tag>
                </td>
                <td class="text-center">
                    <p-button icon="pi pi-pencil" styleClass="p-button-rounded p-button-text p-button-primary mr-2" (onClick)="editar(usuario.id)"></p-button>
                    <p-button icon="pi pi-trash" styleClass="p-button-rounded p-button-text p-button-danger" (onClick)="confirmarExclusao(usuario.id)" [disabled]="!usuario.ativo"></p-button>
                </td>
            </tr>
        </ng-template>
        <ng-template pTemplate="emptymessage">
            <tr>
                <td colspan="5" class="text-center py-4">Nenhum usuário encontrado.</td>
            </tr>
        </ng-template>
    </p-table>
    </div>
</p-card>
