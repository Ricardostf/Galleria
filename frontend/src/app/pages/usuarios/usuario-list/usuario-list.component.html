<p-toast></p-toast>
<p-confirmDialog></p-confirmDialog>

<p-card header="Gerenciamento de Usuários" styleClass="shadow-3 border-round-xl">
    
    <div class="flex justify-content-end mb-4">
        <p-button label="Novo Usuário" icon="pi pi-plus" routerLink="/usuarios/novo" styleClass="p-button-success border-round-lg shadow-2"></p-button>
    </div>

    <p-table [value]="usuarios" [paginator]="true" [rows]="10" [loading]="loading" [rowHover]="true" styleClass="p-datatable-striped p-datatable-sm shadow-1 border-round-lg overflow-hidden">
        <ng-template pTemplate="header">
            <tr>
                <th>ID</th>
                <th>Nome</th>
                <th>Login</th>
                <th>Status</th>
                <th class="text-center">Ações</th>
            </tr>
        </ng-template>
        <ng-template pTemplate="body" let-usuario>
            <tr>
                <td>{{usuario.id}}</td>
                <td>{{usuario.nome}}</td>
                <td>{{usuario.login}}</td>
                <td>
                    <p-tag [severity]="usuario.ativo ? 'success' : 'danger'" [value]="usuario.ativo ? 'Ativo' : 'Inativo'"></p-tag>
                </td>
                <td class="text-center">
                    <p-button icon="pi pi-pencil" styleClass="p-button-rounded p-button-text p-button-primary mr-2" (onClick)="editar(usuario.id)"></p-button>
                    <p-button icon="pi pi-trash" styleClass="p-button-rounded p-button-text p-button-danger" (onClick)="confirmarExclusao(usuario.id)" [disabled]="!usuario.ativo"></p-button>
                </td>
            </tr>
        </ng-template>
        <ng-template pTemplate="emptymessage">
            <tr>
                <td colspan="5" class="text-center py-4">Nenhum usuário encontrado.</td>
            </tr>
        </ng-template>
    </p-table>
</p-card>
