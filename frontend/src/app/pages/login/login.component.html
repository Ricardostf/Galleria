<div class="flex align-items-center justify-content-center min-h-screen bg-gradient-primary">
    <!-- Card wrapper with glass-like effect on larger screens -->
    <div class="surface-card p-6 shadow-card border-round-2xl w-full lg:w-4 mx-3 lg:mx-0 z-5 relative" style="overflow: hidden;">
        <!-- Decorative element -->
        <div class="absolute top-0 left-0 w-full h-1 bg-blue-500"></div>
        
        <div class="text-center mb-6 mt-3">
            <div class="flex justify-content-center mb-4">
                <div class="bg-blue-50 border-circle p-3 flex align-items-center justify-content-center" style="width: 70px; height: 70px;">
                    <i class="pi pi-wallet text-blue-600 text-4xl"></i>
                </div>
            </div>
            <div class="text-900 text-3xl font-bold mb-2 tracking-tight">GalleriaBank</div>
            <span class="text-500 font-medium line-height-3">Acesse sua conta corporativa</span>
        </div>

        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="flex flex-column gap-4">
            
            <div *ngIf="errorMessage" class="mb-2">
                <p-message severity="error" [text]="errorMessage" styleClass="w-full border-round-lg shadow-soft"></p-message>
            </div>

            <div class="field">
                <label for="login" class="block text-700 font-semibold mb-2">Usuário</label>
                <div class="p-input-icon-left w-full">
                    <i class="pi pi-user text-500"></i>
                    <input id="login" type="text" pInputText formControlName="login" class="w-full pl-5" placeholder="Digite seu login" [ngClass]="{'ng-invalid ng-dirty': loginForm.get('login')?.invalid && loginForm.get('login')?.touched}">
                </div>
                <small *ngIf="loginForm.get('login')?.invalid && loginForm.get('login')?.touched" class="p-error block mt-1 font-medium"><i class="pi pi-exclamation-circle mr-1"></i>O login é obrigatório.</small>
            </div>

            <div class="field">
                <label for="senha" class="block text-700 font-semibold mb-2">Senha</label>
                <div class="p-input-icon-left w-full">
                    <i class="pi pi-lock text-500 z-5"></i>
                    <p-password id="senha" formControlName="senha" [toggleMask]="true" styleClass="w-full" inputStyleClass="w-full pl-5" [feedback]="false" placeholder="Digite sua senha" [ngClass]="{'ng-invalid ng-dirty': loginForm.get('senha')?.invalid && loginForm.get('senha')?.touched}"></p-password>
                </div>
                <small *ngIf="loginForm.get('senha')?.invalid && loginForm.get('senha')?.touched" class="p-error block mt-1 font-medium"><i class="pi pi-exclamation-circle mr-1"></i>A senha é obrigatória.</small>
            </div>

            <div class="flex align-items-center justify-content-between mb-2 mt-2">
                <div class="flex align-items-center">
                    <p-checkbox [binary]="true" inputId="lembrar"></p-checkbox>
                    <label for="lembrar" class="ml-2 text-600 font-medium cursor-pointer">Lembrar-me</label>
                </div>
                <a class="font-medium no-underline text-blue-600 hover:text-blue-700 cursor-pointer transition-colors transition-duration-200">Recuperar senha</a>
            </div>

            <p-button label="Entrar na Conta" icon="pi pi-arrow-right" iconPos="right" styleClass="w-full p-3 text-lg font-bold border-round-lg shadow-soft" [loading]="loading" type="submit"></p-button>
        </form>
    </div>
    
    <!-- Background abstract shapes -->
    <div class="absolute top-0 left-0 w-full h-full overflow-hidden z-0" style="pointer-events: none;">
        <div class="absolute bg-white opacity-10 border-circle" style="width: 600px; height: 600px; top: -200px; left: -100px;"></div>
        <div class="absolute bg-white opacity-10 border-circle" style="width: 400px; height: 400px; bottom: -100px; right: -50px;"></div>
    </div>
</div>
