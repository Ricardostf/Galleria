<div class="flex align-items-center justify-content-center min-h-screen bg-blue-50">
    <div class="surface-card p-4 shadow-2 border-round w-full lg:w-4">
        <div class="text-center mb-5">
            <div class="text-900 text-3xl font-medium mb-3">Bem-vindo ao GalleriaBank</div>
            <span class="text-600 font-medium line-height-3">Acesse sua conta para continuar</span>
        </div>

        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
            
            <div *ngIf="errorMessage" class="mb-4">
                <p-message severity="error" [text]="errorMessage" styleClass="w-full"></p-message>
            </div>

            <div class="mb-4">
                <label for="login" class="block text-900 font-medium mb-2">Login</label>
                <input id="login" type="text" pInputText formControlName="login" class="w-full p-3" placeholder="Digite seu login" [ngClass]="{'ng-invalid ng-dirty': loginForm.get('login')?.invalid && loginForm.get('login')?.touched}">
                <small *ngIf="loginForm.get('login')?.invalid && loginForm.get('login')?.touched" class="p-error block mt-1">O login é obrigatório.</small>
            </div>

            <div class="mb-4">
                <label for="senha" class="block text-900 font-medium mb-2">Senha</label>
                <p-password id="senha" formControlName="senha" [toggleMask]="true" styleClass="w-full" inputStyleClass="w-full p-3" [feedback]="false" placeholder="Digite sua senha" [ngClass]="{'ng-invalid ng-dirty': loginForm.get('senha')?.invalid && loginForm.get('senha')?.touched}"></p-password>
                <small *ngIf="loginForm.get('senha')?.invalid && loginForm.get('senha')?.touched" class="p-error block mt-1">A senha é obrigatória.</small>
            </div>

            <div class="flex align-items-center justify-content-between mb-5 mt-2">
                <a class="font-medium no-underline ml-2 text-blue-500 text-right cursor-pointer">Esqueceu a senha?</a>
            </div>

            <p-button label="Entrar" icon="pi pi-user" styleClass="w-full" [loading]="loading" type="submit"></p-button>
        </form>
    </div>
</div>
