<div class="flex align-items-center justify-content-center min-h-screen bg-gradient-primary">
    <!-- Card wrapper with glass-like effect on larger screens -->
    <div class="bg-white-alpha-20 border-1 border-white-alpha-30 p-4 md:p-6 shadow-card border-round-2xl w-full sm:w-10 md:w-8 lg:w-4 mx-3 lg:mx-0 z-5 relative"
        style="overflow: hidden; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);">
        <!-- Decorative element -->
        <div class="absolute top-0 left-0 w-full h-1 bg-white-alpha-50"></div>

        <div class="text-center mb-6 mt-3">
            <div class="flex justify-content-center mb-4">
                <div class="bg-white border-circle p-3 flex align-items-center justify-content-center shadow-soft"
                    style="width: 70px; height: 70px;">
                    <i class="pi pi-wallet text-blue-600 text-4xl"></i>
                </div>
            </div>
            <div class="text-white text-3xl font-bold mb-2 tracking-tight">GalleriaCRUD</div>
            <span class="text-white-alpha-80 font-medium line-height-3">Acesse sua conta</span>
        </div>

        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="flex flex-column gap-4">

            <div *ngIf="errorMessage" class="mb-2">
                <p-message severity="error" [text]="errorMessage"
                    styleClass="w-full border-round-lg shadow-soft"></p-message>
            </div>

            <div class="field">
                <label for="login" class="block text-white font-semibold mb-2">Usuário</label>
                <div class="p-input-icon-right w-full">
                    <i class="pi pi-user text-500"></i>
                    <input id="login" type="text" pInputText formControlName="login" class="w-full"
                        placeholder="Digite seu login"
                        [ngClass]="{'ng-invalid ng-dirty': loginForm.get('login')?.invalid && loginForm.get('login')?.touched}">
                </div>
                <small *ngIf="loginForm.get('login')?.invalid && loginForm.get('login')?.touched"
                    class="text-white-alpha-90 block mt-1 font-medium"><i class="pi pi-exclamation-circle mr-1"></i>O login é
                    obrigatório.</small>
            </div>

            <div class="field">
                <label for="senha" class="block text-white font-semibold mb-2">Senha</label>
                <div class="p-input w-full">
                    <p-password id="senha" formControlName="senha" [toggleMask]="true" styleClass="w-full"
                        inputStyleClass="w-full" [feedback]="false" placeholder="Digite sua senha"
                        [ngClass]="{'ng-invalid ng-dirty': loginForm.get('senha')?.invalid && loginForm.get('senha')?.touched}"></p-password>
                </div>
                <small *ngIf="loginForm.get('senha')?.invalid && loginForm.get('senha')?.touched"
                    class="text-white-alpha-90 block mt-1 font-medium"><i class="pi pi-exclamation-circle mr-1"></i>A senha é
                    obrigatória.</small>
            </div>

            <p-button label="Entrar na Conta" icon="pi pi-arrow-right" iconPos="right"
                styleClass="w-full p-3 text-lg font-bold border-round-lg shadow-soft" [loading]="loading"
                type="submit"></p-button>
        </form>
    </div>

    <!-- Background abstract shapes -->
    <div class="absolute top-0 left-0 w-full h-full overflow-hidden z-0" style="pointer-events: none;">
        <div class="absolute bg-white opacity-10 border-circle"
            style="width: 600px; height: 600px; top: -200px; left: -100px;"></div>
        <div class="absolute bg-white opacity-10 border-circle"
            style="width: 400px; height: 400px; bottom: -100px; right: -50px;"></div>
    </div>
</div>
