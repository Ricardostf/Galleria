<p-toast></p-toast>
<p-confirmDialog></p-confirmDialog>

<p-card styleClass="border-none shadow-card border-round-2xl">
    <ng-template pTemplate="header">
        <div class="flex flex-column md:flex-row align-items-center justify-content-between px-3 md:px-5 pt-4 md:pt-5 pb-3 border-bottom-1 surface-border gap-3 md:gap-0">
            <div class="flex align-items-center gap-3">
                <div class="bg-blue-50 border-circle p-2 flex align-items-center justify-content-center">
                    <i class="pi pi-id-card text-blue-600 text-2xl"></i>
                </div>
                <h2 class="m-0 text-900 font-bold text-center md:text-left text-xl md:text-2xl">Gerenciamento de Clientes</h2>
            </div>
            <p-button label="Novo Cliente" icon="pi pi-plus" routerLink="/clientes/novo" styleClass="p-button-primary border-round-lg shadow-soft white-space-nowrap"></p-button>
        </div>
    </ng-template>

    <div class="p-3">
        <p-table [value]="clientes" [paginator]="true" [rows]="10" [loading]="loading" [rowHover]="true" responsiveLayout="scroll" styleClass="p-datatable-striped border-round-lg overflow-hidden">
        <ng-template pTemplate="header">
            <tr>
                <th>ID</th>
                <th>Nome</th>
                <th>CPF</th>
                <th>Telefone</th>
                <th class="text-center">Ações</th>
            </tr>
        </ng-template>
        <ng-template pTemplate="body" let-cliente>
            <tr>
                <td>{{cliente.id}}</td>
                <td>{{cliente.nome}}</td>
                <td>{{cliente.cpf}}</td>
                <td>{{cliente.telefone}}</td>
                <td class="text-center">
                    <p-button icon="pi pi-pencil" styleClass="p-button-rounded p-button-text p-button-primary mr-2" (onClick)="editar(cliente.id)"></p-button>
                    <p-button icon="pi pi-trash" styleClass="p-button-rounded p-button-text p-button-danger" (onClick)="confirmarExclusao(cliente.id)"></p-button>
                </td>
            </tr>
        </ng-template>
        <ng-template pTemplate="emptymessage">
            <tr>
                <td colspan="5" class="text-center py-4">Nenhum cliente encontrado.</td>
            </tr>
        </ng-template>
    </p-table>
    </div>
</p-card>
