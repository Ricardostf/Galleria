<p-toast></p-toast>
<p-confirmDialog></p-confirmDialog>

<p-card header="Gerenciamento de Clientes" styleClass="shadow-3 border-round-xl">
    
    <div class="flex justify-content-end mb-4">
        <p-button label="Novo Cliente" icon="pi pi-plus" routerLink="/clientes/novo" styleClass="p-button-success border-round-lg shadow-2"></p-button>
    </div>

    <p-table [value]="clientes" [paginator]="true" [rows]="10" [loading]="loading" [rowHover]="true" styleClass="p-datatable-striped p-datatable-sm shadow-1 border-round-lg overflow-hidden">
        <ng-template pTemplate="header">
            <tr>
                <th>ID</th>
                <th>Nome</th>
                <th>CPF</th>
                <th>Telefone</th>
                <th class="text-center">Ações</th>
            </tr>
        </ng-template>
        <ng-template pTemplate="body" let-cliente>
            <tr>
                <td>{{cliente.id}}</td>
                <td>{{cliente.nome}}</td>
                <td>{{cliente.cpf}}</td>
                <td>{{cliente.telefone}}</td>
                <td class="text-center">
                    <p-button icon="pi pi-pencil" styleClass="p-button-rounded p-button-text p-button-primary mr-2" (onClick)="editar(cliente.id)"></p-button>
                    <p-button icon="pi pi-trash" styleClass="p-button-rounded p-button-text p-button-danger" (onClick)="confirmarExclusao(cliente.id)"></p-button>
                </td>
            </tr>
        </ng-template>
        <ng-template pTemplate="emptymessage">
            <tr>
                <td colspan="5" class="text-center py-4">Nenhum cliente encontrado.</td>
            </tr>
        </ng-template>
    </p-table>
</p-card>
